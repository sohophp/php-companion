name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified VSIX files to Visual Studio Marketplace
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF" = "refs/tags/v$(node -p 'require("./package.json").version')"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: phpunit:9.6.36, php-cs-fixer:3.95.22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm verify:packages
      - run: node scripts/benchmark-editing.mjs 1000 100 > editing-resilience-Linux-X64.json
      - run: pnpm package:all
      - run: pnpm verify:vsix
      - run: pnpm exec tsc -p test/extension/tsconfig.json
      - run: node scripts/run-extension-test.mjs ./dist-test/runPackagedTest.js
      - name: Install pinned Open Source Profile
        run: pnpm install:open-source-profile
        env:
          PHP_COMPANION_TEST_EXTENSIONS_DIR: ${{ runner.temp }}/php-companion-open-source-extensions
      - name: Test packaged Open Source Profile
        run: node scripts/run-extension-test.mjs ./dist-test/runPackagedTest.js
        env:
          PHP_COMPANION_TEST_EXTENSIONS_DIR: ${{ runner.temp }}/php-companion-open-source-extensions
          PHP_COMPANION_PHP_EXECUTABLE: php
          PHP_COMPANION_FORMATTER_EXECUTABLE: php-cs-fixer
          PHP_COMPANION_PHPUNIT_EXECUTABLE: phpunit
      - uses: actions/upload-artifact@v7
        with:
          name: editing-resilience-Linux-X64
          if-no-files-found: error
          path: editing-resilience-Linux-X64.json
      - uses: actions/upload-artifact@v7
        with:
          name: php-companion-vsix
          if-no-files-found: error
          path: |
            php-companion-*.vsix
            packages/php-companion-symfony/php-companion-symfony-*.vsix
            packages/php-companion-extension-pack/php-companion-open-source-pack-*.vsix

  publish-marketplace:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: php-companion-vsix
      - name: Verify release tag and package version
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF" = "refs/tags/v$VERSION"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Verify Marketplace credentials
        run: pnpm exec vsce verify-pat sohophp
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish SoPHP
        run: pnpm exec vsce publish --packagePath "php-companion-${RELEASE_VERSION}.vsix"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish SoPHP Symfony
        run: pnpm exec vsce publish --packagePath "packages/php-companion-symfony/php-companion-symfony-${RELEASE_VERSION}.vsix"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish SoPHP Open Source Pack
        run: pnpm exec vsce publish --packagePath "packages/php-companion-extension-pack/php-companion-open-source-pack-${RELEASE_VERSION}.vsix"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
