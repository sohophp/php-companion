name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Verify release tag
        run: |
          version=$(node -p 'require("./package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF" = "refs/tags/v$version"
          git merge-base --is-ancestor HEAD origin/main
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: phpunit:9.6.36, php-cs-fixer:3.95.22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm verify:packages
      - run: node scripts/benchmark-editing.mjs 1000 100 > editing-resilience-Linux-X64.json
      - run: pnpm test
      - name: Build reference cache test providers
        run: pnpm --dir packages/php-companion-symfony build
      - name: Cross-process reference cache regression
        id: reference_cache_test
        working-directory: packages/language-server
        run: |
          pnpm exec vitest run test/stdio.test.ts -t "restores proven references across processes and rejects changed query inputs" --reporter=json --outputFile=../../reference-cache-${{ runner.os }}-${{ runner.arch }}.json
          node ../../scripts/verify-reference-cache-test.mjs ../../reference-cache-${{ runner.os }}-${{ runner.arch }}.json
        env:
          PHP_COMPANION_TEST_REFERENCE_BUNDLE: ${{ github.workspace }}/dist/language-server.js
      - name: Upload reference cache regression result
        if: always() && steps.reference_cache_test.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: reference-cache-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: reference-cache-${{ runner.os }}-${{ runner.arch }}.json
      - run: pnpm package:all
      - run: pnpm verify:vsix
      - run: pnpm exec tsc -p test/extension/tsconfig.json
      - run: node scripts/run-extension-test.mjs ./dist-test/runPackagedTest.js
      - name: Install pinned Open Source Profile
        run: pnpm install:open-source-profile
        env:
          PHP_COMPANION_TEST_EXTENSIONS_DIR: ${{ runner.temp }}/php-companion-open-source-extensions
      - name: Test packaged Open Source Profile
        run: node scripts/run-extension-test.mjs ./dist-test/runPackagedTest.js
        env:
          PHP_COMPANION_TEST_EXTENSIONS_DIR: ${{ runner.temp }}/php-companion-open-source-extensions
          PHP_COMPANION_PHP_EXECUTABLE: php
          PHP_COMPANION_FORMATTER_EXECUTABLE: php-cs-fixer
          PHP_COMPANION_PHPUNIT_EXECUTABLE: phpunit
      - uses: actions/upload-artifact@v7
        with:
          name: editing-resilience-Linux-X64
          if-no-files-found: error
          path: editing-resilience-Linux-X64.json
      - name: Collect verified VSIX files
        run: |
          mkdir release-assets
          cp "php-companion-${RELEASE_VERSION}.vsix" release-assets/
          cp "packages/php-companion-symfony/php-companion-symfony-${RELEASE_VERSION}.vsix" release-assets/
          cp "packages/php-companion-extension-pack/php-companion-open-source-pack-${RELEASE_VERSION}.vsix" release-assets/
      - uses: actions/upload-artifact@v7
        with:
          name: php-companion-vsix
          if-no-files-found: error
          path: release-assets/*.vsix

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: php-companion-vsix
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          cd release-assets
          files=(
            "php-companion-${version}.vsix"
            "php-companion-symfony-${version}.vsix"
            "php-companion-open-source-pack-${version}.vsix"
          )
          sha256sum "${files[@]}" > SHA256SUMS
          gh release create "$TAG" --verify-tag --title "SoPHP $version" --notes-from-tag \
            "${files[@]}" SHA256SUMS
