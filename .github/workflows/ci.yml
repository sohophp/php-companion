name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm verify:packages
      - name: Editing resilience benchmark
        run: node scripts/benchmark-editing.mjs 500 50 > editing-resilience-${{ runner.os }}-${{ runner.arch }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: editing-resilience-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: editing-resilience-${{ runner.os }}-${{ runner.arch }}.json
      - name: Persistent semantic index benchmark
        run: node scripts/benchmark-persistent-index.mjs 1000 > persistent-index-${{ runner.os }}-${{ runner.arch }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: persistent-index-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: persistent-index-${{ runner.os }}-${{ runner.arch }}.json
      - run: pnpm test
      - name: Build reference cache test providers
        if: runner.os == 'Linux'
        run: pnpm --dir packages/php-companion-symfony build
      - name: Cross-process reference cache regression
        id: reference_cache_test
        if: runner.os == 'Linux'
        working-directory: packages/language-server
        run: |
          pnpm exec vitest run test/stdio.test.ts -t "restores proven references across processes and rejects changed query inputs" --reporter=json --outputFile=../../reference-cache-${{ runner.os }}-${{ runner.arch }}.json
          node ../../scripts/verify-reference-cache-test.mjs ../../reference-cache-${{ runner.os }}-${{ runner.arch }}.json
        env:
          PHP_COMPANION_TEST_REFERENCE_BUNDLE: ${{ github.workspace }}/dist/language-server.js
      - name: Upload reference cache regression result
        if: always() && runner.os == 'Linux' && steps.reference_cache_test.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: reference-cache-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: reference-cache-${{ runner.os }}-${{ runner.arch }}.json
      - run: pnpm package:all
      - run: pnpm verify:vsix
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: php-companion-vsix
          if-no-files-found: error
          path: |
            php-companion-*.vsix
            packages/php-companion-symfony/php-companion-symfony-*.vsix
            packages/php-companion-extension-pack/php-companion-open-source-pack-*.vsix

  index-runtime-compatibility:
    name: Index runtime (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['20.0.0', '20.11.1']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Select supported package runtime
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Recursive Composer discovery and cache regression
        id: index_runtime_test
        env:
          SOPHP_EXPECTED_NODE_VERSION: ${{ matrix.node }}
        run: |
          node -e "require('node:assert/strict').equal(process.versions.node, process.env.SOPHP_EXPECTED_NODE_VERSION)"
          node --test scripts/test/index-runtime-compatibility.test.mjs > index-runtime-${{ matrix.node }}.tap 2>&1
      - name: Restore build runtime
        if: always()
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Upload index runtime regression result
        if: always() && steps.index_runtime_test.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: index-runtime-${{ matrix.node }}
          if-no-files-found: error
          path: index-runtime-${{ matrix.node }}.tap

  php-integration:
    name: PHP ${{ matrix.php }} integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration:php
        env:
          PHP_COMPANION_TEST_PHP_BINARIES: '{"${{ matrix.php }}":"php"}'

  extension-host:
    name: Extension host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PHP_COMPANION_TEST_LOG_DIR: .vscode-test/ci-extension-logs
      PHP_COMPANION_TEST_FAILURE_LOG_DIR: .vscode-test/ci-extension-logs/source-failures
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:extension:packaged
      - if: runner.os == 'Linux'
        run: pnpm test:extension
      - if: runner.os == 'Linux'
        run: pnpm test:extension:intelephense
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: extension-host-logs-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: ignore
          path: .vscode-test/ci-extension-logs

  open-source-profile:
    name: Open Source Profile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: phpunit:9.6.36, php-cs-fixer:3.95.22
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Open Source Profile
        run: pnpm install:open-source-profile
        env:
          PHP_COMPANION_TEST_EXTENSIONS_DIR: ${{ runner.temp }}/php-companion-open-source-extensions
      - name: Run complete Open Source Profile
        run: pnpm test:extension:open-source-profile
        env:
          PHP_COMPANION_TEST_EXTENSIONS_DIR: ${{ runner.temp }}/php-companion-open-source-extensions
          PHP_COMPANION_PHP_EXECUTABLE: php
          PHP_COMPANION_FORMATTER_EXECUTABLE: php-cs-fixer
          PHP_COMPANION_PHPUNIT_EXECUTABLE: phpunit
